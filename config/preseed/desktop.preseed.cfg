# ============================================================
# TérangaOS Desktop — Preseed (automated installation)
# Pre-configured answers for Debian installer
# ============================================================

# --- Language and localization ---
d-i debian-installer/language string fr
d-i debian-installer/country string SN
d-i debian-installer/locale string fr_SN.UTF-8
d-i localechooser/supported-locales multiselect fr_FR.UTF-8, wo_SN.UTF-8, en_US.UTF-8

# --- Keyboard ---
d-i keyboard-configuration/xkb-keymap select fr
d-i keyboard-configuration/layoutcode string fr

# --- Network ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string terangaos
d-i netcfg/get_domain string local

# --- Mirror ---
d-i mirror/country string SN
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- Timezone ---
d-i time/zone string Africa/Dakar
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# --- Partitioning ---
# Use entire disk with encrypted LVM
d-i partman-auto/method string crypto
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- User account ---
d-i passwd/root-login boolean false
d-i passwd/user-fullname string TérangaOS User
d-i passwd/username string user
# Password will be asked at installation
d-i user-setup/allow-password-weak boolean false

# --- APT ---
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates

# --- Package selection ---
tasksel tasksel/first multiselect kde-desktop, french

# --- GRUB ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# --- Installation complete ---
d-i finish-install/reboot_in_progress note
